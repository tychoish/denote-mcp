name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container: silex/emacs:${{ matrix.emacs-version }}-ci
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        emacs-version:
          - "29.4"
          - "30.2"

    steps:
      - uses: actions/checkout@v5

      - name: Lint Source Code
        uses: tychoish/elisp-ci/lint@main

      - name: Install Markdown tree-sitter grammars
        shell: bash
        run: |
          emacs --batch -Q --eval '
          (progn
            (require (quote treesit))
            (setq treesit-language-source-alist
                  (quote ((markdown "https://github.com/tree-sitter-grammars/tree-sitter-markdown" "split_parser" "tree-sitter-markdown/src")
                          (markdown-inline "https://github.com/tree-sitter-grammars/tree-sitter-markdown" "split_parser" "tree-sitter-markdown-inline/src"))))
            (treesit-install-language-grammar (quote markdown))
            (treesit-install-language-grammar (quote markdown-inline)))'

      - name: Run Tests
        uses: tychoish/elisp-ci@main
        with:
          runner: ert
